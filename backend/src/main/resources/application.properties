#Set this to your own application.properties for development
spring.profiles.active=prod

server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
app.jwt.secret=${JWT_SECRET:}
app.seed.enabled=${SEED_ENABLED:true}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
